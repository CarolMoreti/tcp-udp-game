<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floresta Encantada TCP & UDP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#000;
}

.game{
    width:100vw;
    height:100vh;
    position:relative;
    background:url('./360_F_599720625_N2U8AQzhS5y7llrp2AMAQmKL4B6nWHKT.jpg');
    background-size:cover;
    background-position:center;
    overflow:hidden;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.2);
}

.player{
    position:absolute;
    bottom:60px;
    left:80px;
    width:90px;
    height:120px;

    background-image:url("vecteezy_cute-fairy-knight-in-pixel-art_73096999.png");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    image-rendering:pixelated;
    transition:0.1s linear;
    z-index:5;
}

.floor{
    position:absolute;
    bottom:0;
    width:100%;
    height:60px;
    background:#143d2f;
    border-top:4px solid #4ee38f;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:70px;
    height:70px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:35px;
    background:rgba(255,255,255,0.2);
    color:white;
    backdrop-filter:blur(5px);
    transition:0.3s;
    z-index:50;
}

.arrow:hover{
    transform:translateY(-50%) scale(1.1);
    background:#4ee38f;
    color:#123;
}

.left{
    left:20px;
}

.right{
    right:20px;
}

.dialogue{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:80px;
    width:80%;
    max-width:950px;
    background:rgba(13,22,18,0.94);
    border:4px solid #5cffaa;
    border-radius:25px;
    padding:25px;
    color:white;
    box-shadow:0 0 20px rgba(92,255,170,0.4);
    z-index:10;
}

.character{
    font-size:28px;
    color:#91ffcb;
    margin-bottom:15px;
}

.text{
    font-size:20px;
    line-height:1.7;
}

.question{
    margin-top:25px;
    font-size:24px;
    color:#b7ffe0;
}

.options{
    margin-top:20px;
    display:grid;
    gap:15px;
}

.option{
    background:#204533;
    border:2px solid transparent;
    padding:15px;
    border-radius:18px;
    cursor:pointer;
    transition:0.3s;
    font-size:18px;
}

.option:hover{
    background:#35684f;
    transform:scale(1.02);
}

.correct{
    background:#3abf75 !important;
}

.wrong{
    background:#d95353 !important;
}

.result{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.88);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:100;
    padding:30px;
    text-align:center;
}

.result h1{
    font-size:50px;
    margin-bottom:20px;
    color:#91ffcb;
}

.result p{
    font-size:24px;
    margin-bottom:20px;
}

.restart{
    padding:16px 30px;
    border:none;
    border-radius:20px;
    font-size:22px;
    cursor:pointer;
    background:#5cffaa;
    color:#123;
    transition:0.3s;
}

.restart:hover{
    transform:scale(1.1);
}

.errors{
    margin-top:20px;
    max-width:800px;
    text-align:left;
    background:#183026;
    padding:20px;
    border-radius:20px;
}

.phase{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.4);
    padding:12px 25px;
    border-radius:20px;
    color:#91ffcb;
    font-size:22px;
    border:2px solid #5cffaa;
    z-index:20;
}
    @media (max-width: 768px){

    .dialogue{
        width:88%;
        max-width:340px;

        left:50%;
        transform:translateX(-50%);

        bottom:70px;

        padding:5px;

        border-radius:22px;

        max-height:72vh;

        overflow-y:auto;
    }

    .character{
        font-size:20px;
        margin-bottom:10px;
    }

    .text{
        font-size:14px;
        line-height:1.5;
        margin-bottom:10px;
    }

    .question{
        font-size:18px;
        margin-top:14px;
        line-height:1.4;
    }

    .options{
        gap:12px;
        margin-top:16px;
    }

    .option{
        font-size:15px;
        padding:14px;
        border-radius:14px;
    }

    .arrow{
        width:52px;
        height:52px;
        font-size:24px;

        top:auto;
        bottom:310px;

        z-index:40;
    }

    .left{
        left:8px;
    }

    .right{
        right:8px;
    }

    .phase{
        font-size:16px;
        padding:8px 16px;
        top:16px;
    }

    .player{
        width:58px;
        height:82px;

        left:20px;
        bottom:48px;
    }

    .floor{
        height:48px;
    }

    .result h1{
        font-size:30px;
    }

    .result p{
        font-size:18px;
    }

    .errors{
        width:92%;
        font-size:14px;
        max-height:260px;
        overflow-y:auto;
    }

    .restart{
        font-size:18px;
        padding:12px 20px;
    }

    }

@media (max-width: 768px){

    .dialogue{

        width:82%;
        max-width:300px;

        left:50%;
        transform:translateX(-50%);

    margin-top:-20px;
        padding:7px;

        border-radius:18px;

        max-height:58vh;

        overflow-y:auto;

    }

    .character{
        font-size:18px;
        margin-bottom:8px;
    }

    .text{
        font-size:13px;
        line-height:1.4;
        margin-bottom:8px;
    }

    .question{
        font-size:16px;
        margin-top:12px;
        line-height:1.3;
    }

    .options{
        gap:10px;
        margin-top:14px;
    }

    .option{
        font-size:14px;
        padding:12px;
        border-radius:12px;
    }

    .arrow{

        width:48px;
        height:48px;

        font-size:22px;

        top:50%;
        transform:translateY(-50%);

        z-index:40;

    }

    .left{
        left:4px;
    }

    .right{
        right:4px;
    }

    .phase{

        font-size:15px;

        padding:7px 7px;

        top:18px;

    }

    .player{

        width:54px;
        height:76px;

        left:14px;
        bottom:46px;

    }

    .floor{
        height:46px;
    }

}

</style>
</head>

<body>

<div class="game">

<div class="overlay"></div>

<div class="phase" id="phase">
Fase 1 / 7
</div>

<div class="player" id="player"></div>

<button class="arrow left" onclick="prevScene()">
⬅
</button>

<button class="arrow right" onclick="nextScene()">
➡
</button>

<div class="dialogue">

<div class="character" id="character">
Lyria 🌿
</div>

<div class="text" id="story"></div>

<div class="question" id="question"></div>

<div class="options" id="options"></div>

</div>

<div class="floor"></div>

<div class="result" id="result">

<h1>✨ Jornada Finalizada ✨</h1>

<p id="score"></p>

<div class="errors" id="errors"></div>

<button class="restart" onclick="restartGame()">
Jogar Novamente 🌿
</button>

</div>

</div>

<script>

const allQuestions = [

{
character:"Lyria 🌿",
story:"Olá, aventureira da floresta encantada! 🌱 Hoje vou te ensinar sobre o TCP. Imagine que você quer enviar uma carta muito importante para alguém do outro lado da floresta. Você gostaria que ela chegasse inteira, sem perder pedaços e na ordem correta, certo? É exatamente isso que o TCP faz na internet! Ele garante que os dados cheguem completos e organizados. Se alguma parte se perder no caminho, ele pede para enviar novamente.",
question:"Qual é a principal característica do TCP?",
options:[
"Comunicação sem conexão",
"Entrega garantida e ordenada",
"Baixa latência",
"Difusão de pacotes"
],
answer:1,
explanation:"TCP garante entrega confiável e organizada."
},

{
character:"Finn 🍄",
story:"O UDP é um mensageiro muito veloz 🍃 Ele entrega mensagens rapidamente sem verificar se tudo chegou perfeitamente. Isso faz ele ser ótimo para jogos e chamadas ao vivo.",
question:"O UDP é geralmente utilizado quando:",
options:[
"A confiabilidade é mais importante",
"É necessário controlar congestionamento",
"A velocidade é mais importante",
"É obrigatório o handshake"
],
answer:2,
explanation:"UDP prioriza velocidade."
},

{
character:"Nixie ✨",
story:"Antes do TCP começar a enviar dados, ele faz um ritual mágico chamado handshake ✨ Esse processo garante que os dois lados estão prontos para conversar.",
question:"O processo de estabelecimento de conexão no TCP é conhecido como:",
options:[
"Two-way handshake",
"Slow start",
"Three-way handshake",
"Fast open"
],
answer:2,
explanation:"TCP utiliza Three-way Handshake."
},

{
character:"Kael 🌙",
story:"Na floresta das redes, alguns protocolos criam uma conexão segura antes de conversar 🌲 Isso significa que os dispositivos se organizam antes da transmissão.",
question:"Qual dos protocolos abaixo é orientado à conexão?",
options:[
"UDP",
"TCP",
"Ethernet",
"ARP"
],
answer:1,
explanation:"TCP é orientado à conexão."
},

{
character:"Lumina 🧚",
story:"Aplicações de vídeo e voz precisam de velocidade 🎥 Mesmo que alguns pacotes se percam, o importante é não travar.",
question:"Em qual situação o UDP é mais recomendado?",
options:[
"Transferência de arquivos",
"Transações bancárias",
"Aplicações de voz e vídeo",
"Download de backup crítico"
],
answer:2,
explanation:"UDP é ideal para streaming."
},

{
character:"Eldrin 🌲",
story:"O TCP possui muitos mecanismos de controle mágicos ✨ Isso faz seu cabeçalho ser maior que o do UDP.",
question:"O cabeçalho TCP possui:",
options:[
"Menos campos que o UDP",
"Mais campos que o UDP",
"O mesmo número de campos",
"Nenhum campo de controle"
],
answer:1,
explanation:"TCP possui mais informações no cabeçalho."
},

{
character:"Thorn 🍃",
story:"Os pacotes precisam chegar organizados 📦 O TCP usa números especiais para reorganizar tudo corretamente.",
question:"O campo usado para garantir entrega ordenada no TCP é:",
options:[
"Porta de origem",
"Número de sequência",
"Porta de destino",
"Checksum"
],
answer:1,
explanation:"Números de sequência organizam os pacotes."
},

{
character:"Lyria 🌿",
story:"UDP é rápido porque não verifica tudo 🌪️ Ele simplesmente envia os dados sem garantir entrega.",
question:"O UDP é considerado um protocolo:",
options:[
"Confiável",
"Orientado à conexão",
"Simples e sem garantia de entrega",
"Baseado em janelas"
],
answer:2,
explanation:"UDP não garante entrega."
},

{
character:"Finn 🍄",
story:"TCP e UDP vivem em uma camada específica do modelo OSI 🌐 Essa camada é responsável pela comunicação entre aplicações.",
question:"Qual camada do modelo OSI contém TCP e o UDP?",
options:[
"Rede",
"Transporte",
"Aplicação",
"Sessão"
],
answer:1,
explanation:"Eles pertencem à camada de transporte."
},

{
character:"Nixie ✨",
story:"Quando muitas mensagens atravessam a floresta, pode haver congestionamento 🚦 O TCP possui mecanismos mágicos para evitar isso.",
question:"Qual desses protocolos utiliza controle de congestionamento?",
options:[
"UDP",
"FTP",
"TCP",
"TFTP"
],
answer:2,
explanation:"TCP controla congestionamento."
}

];

function shuffle(array){
    return array.sort(()=>Math.random()-0.5);
}

let phases = [];

function generateRound(){
    phases = shuffle([...allQuestions]).slice(0,7);
}

let current = 0;
let score = 0;
let errors = [];

const player = document.getElementById("player");

let playerX = 80;

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowRight"){
        playerX += 20;
    }

    if(e.key==="ArrowLeft"){
        playerX -= 20;
    }

    player.style.left = playerX + "px";

});

function loadScene(){

    const phase = phases[current];

    document.getElementById("phase").innerText =
    `Fase ${current+1} / 7`;

    document.getElementById("character").innerText =
    phase.character;

    document.getElementById("story").innerText =
    phase.story;

    document.getElementById("question").innerText =
    phase.question;

    const optionsDiv =
    document.getElementById("options");

    optionsDiv.innerHTML = "";

    phase.options.forEach((option,index)=>{

        const div = document.createElement("div");

        div.classList.add("option");

        div.innerText = option;

        div.onclick = ()=>selectAnswer(div,index);

        optionsDiv.appendChild(div);

    });

}

function selectAnswer(element,index){

    const phase = phases[current];

    const options =
    document.querySelectorAll(".option");

    options.forEach(opt=>{
        opt.style.pointerEvents="none";
    });

    if(index===phase.answer){

        element.classList.add("correct");

        score++;

    }else{

        element.classList.add("wrong");

        options[phase.answer]
        .classList.add("correct");

        errors.push({
            question:phase.question,
            explanation:phase.explanation
        });

    }

}

function nextScene(){

    current++;

    if(current >= phases.length){

        finishGame();
        return;
    }

    loadScene();

}

function prevScene(){

    if(current>0){

        current--;

        loadScene();

    }

}

function finishGame(){

    document.getElementById("result")
    .style.display="flex";

    document.getElementById("score")
    .innerText =
    `Você acertou ${score} de 7 questões!`;

    const errorsDiv =
    document.getElementById("errors");

    if(errors.length===0){

        errorsDiv.innerHTML =
        "🌟 Você dominou a magia das redes!";

    }else{

        let html = "<h2>✨ Explicações:</h2><br>";

        errors.forEach(err=>{

            html += `
            <p>
            <strong>${err.question}</strong><br>
            ${err.explanation}
            </p><br>
            `;

        });

        errorsDiv.innerHTML = html;

    }

}

function restartGame(){

    current = 0;
    score = 0;
    errors = [];

    generateRound();

    document.getElementById("result")
    .style.display="none";

    loadScene();

}

generateRound();
loadScene();

</script>

</body>
</html>
```

Depois é só adicionar as outras perguntas no array `allQuestions` seguindo o mesmo modelo das primeiras.
