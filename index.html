<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floresta Encantada TCP & UDP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#000;
}

/* FUNDO PIXEL ART */
.game{
    width:100vw;
    height:100vh;
    position:relative;
    background:url('360_F_599720625_N2U8AQzhS5y7llrp2AMAQmKL4B6nWHKT.jpg');
    background-size:cover;
    background-position:center;
    overflow:hidden;
}

/* ESCURECER */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.2);
}

/* PERSONAGEM */
.player{
    position:absolute;
    bottom:60px;
    left:80px;
    width:90px;
    height:120px;
    background:url('https://i.imgur.com/Ly6r3VB.png');
    background-size:cover;
    image-rendering:pixelated;
    transition:0.1s linear;
}

/* CHÃO */
.floor{
    position:absolute;
    bottom:0;
    width:100%;
    height:60px;
    background:#143d2f;
    border-top:4px solid #4ee38f;
}

/* SETAS */
.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:70px;
    height:70px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:35px;
    background:rgba(255,255,255,0.2);
    color:white;
    backdrop-filter:blur(5px);
    transition:0.3s;
    z-index:50;
}

.arrow:hover{
    transform:translateY(-50%) scale(1.1);
    background:#4ee38f;
    color:#123;
}

.left{
    left:20px;
}

.right{
    right:20px;
}

/* CAIXA DIALOGO */
.dialogue{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:80px;
    width:80%;
    max-width:900px;
    background:rgba(13,22,18,0.92);
    border:4px solid #5cffaa;
    border-radius:25px;
    padding:25px;
    color:white;
    box-shadow:0 0 20px rgba(92,255,170,0.4);
}

.character{
    font-size:26px;
    color:#91ffcb;
    margin-bottom:10px;
}

.text{
    font-size:20px;
    line-height:1.5;
}

.question{
    margin-top:20px;
    font-size:24px;
}

.options{
    margin-top:20px;
    display:grid;
    gap:15px;
}

.option{
    background:#204533;
    border:2px solid transparent;
    padding:15px;
    border-radius:18px;
    cursor:pointer;
    transition:0.3s;
    font-size:18px;
}

.option:hover{
    background:#35684f;
    transform:scale(1.02);
}

.correct{
    background:#3abf75 !important;
}

.wrong{
    background:#d95353 !important;
}

/* RESULTADO */
.result{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:100;
    padding:30px;
    text-align:center;
}

.result h1{
    font-size:50px;
    margin-bottom:20px;
    color:#91ffcb;
}

.result p{
    font-size:24px;
    margin-bottom:20px;
}

.restart{
    padding:16px 30px;
    border:none;
    border-radius:20px;
    font-size:22px;
    cursor:pointer;
    background:#5cffaa;
    color:#123;
    transition:0.3s;
}

.restart:hover{
    transform:scale(1.1);
}

.errors{
    margin-top:20px;
    max-width:800px;
    text-align:left;
    background:#183026;
    padding:20px;
    border-radius:20px;
}

.phase{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.4);
    padding:12px 25px;
    border-radius:20px;
    color:#91ffcb;
    font-size:22px;
    border:2px solid #5cffaa;
}

</style>
</head>

<body>

<div class="game">

<div class="overlay"></div>

<div class="phase" id="phase">
Fase 1 / 7
</div>

<div class="player" id="player"></div>

<button class="arrow left" onclick="prevScene()">
⬅
</button>

<button class="arrow right" onclick="nextScene()">
➡
</button>

<div class="dialogue">

<div class="character" id="character">
Lyria 🌿
</div>

<div class="text" id="story">
O TCP garante que todas as mensagens mágicas cheguem corretamente.
</div>

<div class="question" id="question">
Qual é a principal característica do TCP?
</div>

<div class="options" id="options"></div>

</div>

<div class="floor"></div>

<div class="result" id="result">

<h1>✨ Jornada Finalizada ✨</h1>

<p id="score"></p>

<div class="errors" id="errors"></div>

<button class="restart" onclick="restartGame()">
Jogar Novamente 🌿
</button>

</div>

</div>

<script>

const phases = [

{
character:"Lyria 🌿",
story:"O TCP é um guardião mágico que protege todas as mensagens enviadas pela floresta.",
question:"Qual é a principal característica do TCP?",
options:[
"Comunicação sem conexão",
"Entrega garantida e ordenada",
"Baixa latência",
"Difusão de pacotes"
],
answer:1,
explanation:"TCP garante entrega confiável e organizada."
},

{
character:"Finn 🍄",
story:"O UDP corre veloz pela floresta sem esperar confirmações.",
question:"O UDP é geralmente utilizado quando:",
options:[
"A confiabilidade é mais importante",
"É necessário controlar congestionamento",
"A velocidade é mais importante",
"É obrigatório handshake"
],
answer:2,
explanation:"UDP prioriza velocidade."
},

{
character:"Nixie ✨",
story:"Antes do TCP conversar, ele faz um ritual mágico de conexão.",
question:"Como se chama esse ritual?",
options:[
"Two-way handshake",
"Slow start",
"Three-way handshake",
"Fast open"
],
answer:2,
explanation:"TCP utiliza Three-way Handshake."
},

{
character:"Kael 🌙",
story:"Algumas aplicações preferem velocidade acima da perfeição.",
question:"Onde o UDP é mais recomendado?",
options:[
"Transferência de arquivos",
"Transações bancárias",
"Voz e vídeo",
"Backup crítico"
],
answer:2,
explanation:"Streaming usa UDP."
},

{
character:"Lumina 🧚",
story:"Os ACKs avisam quando um pacote chegou corretamente.",
question:"No TCP, o ACK confirma:",
options:[
"Pacote incompleto",
"Pacote correto",
"Porta fechada",
"IP incorreto"
],
answer:1,
explanation:"ACK confirma recebimento."
},

{
character:"Eldrin 🌲",
story:"Os números de sequência mantêm a ordem dos pacotes mágicos.",
question:"TCP usa números de sequência para:",
options:[
"Identificar portas",
"Sincronizar relógios",
"Reordenar pacotes",
"Eliminar congestionamento"
],
answer:2,
explanation:"Sequência organiza os dados."
},

{
character:"Thorn 🍃",
story:"A floresta precisa equilibrar velocidade e confiabilidade.",
question:"UDP permite:",
options:[
"Handshake",
"Retransmissão automática",
"Baixa sobrecarga",
"Controle de janela"
],
answer:2,
explanation:"UDP é leve e rápido."
}

];

let current = 0;
let score = 0;
let errors = [];

const player = document.getElementById("player");

let playerX = 80;

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowRight"){
        playerX += 20;
    }

    if(e.key==="ArrowLeft"){
        playerX -= 20;
    }

    player.style.left = playerX + "px";

});

function loadScene(){

    const phase = phases[current];

    document.getElementById("phase").innerText =
    `Fase ${current+1} / 7`;

    document.getElementById("character").innerText =
    phase.character;

    document.getElementById("story").innerText =
    phase.story;

    document.getElementById("question").innerText =
    phase.question;

    const optionsDiv =
    document.getElementById("options");

    optionsDiv.innerHTML = "";

    phase.options.forEach((option,index)=>{

        const div = document.createElement("div");

        div.classList.add("option");

        div.innerText = option;

        div.onclick = ()=>selectAnswer(div,index);

        optionsDiv.appendChild(div);

    });

}

function selectAnswer(element,index){

    const phase = phases[current];

    const options =
    document.querySelectorAll(".option");

    options.forEach(opt=>{
        opt.style.pointerEvents="none";
    });

    if(index===phase.answer){

        element.classList.add("correct");

        score++;

    }else{

        element.classList.add("wrong");

        options[phase.answer]
        .classList.add("correct");

        errors.push({
            question:phase.question,
            explanation:phase.explanation
        });

    }

}

function nextScene(){

    current++;

    if(current >= phases.length){

        finishGame();
        return;
    }

    loadScene();

}

function prevScene(){

    if(current>0){

        current--;

        loadScene();

    }

}

function finishGame(){

    document.getElementById("result")
    .style.display="flex";

    document.getElementById("score")
    .innerText =
    `Você acertou ${score} de 7 questões!`;

    const errorsDiv =
    document.getElementById("errors");

    if(errors.length===0){

        errorsDiv.innerHTML =
        "🌟 Você dominou a magia das redes!";

    }else{

        let html = "<h2>✨ Explicações:</h2><br>";

        errors.forEach(err=>{

            html += `
            <p>
            <strong>${err.question}</strong><br>
            ${err.explanation}
            </p><br>
            `;

        });

        errorsDiv.innerHTML = html;

    }

}

function restartGame(){

    current = 0;
    score = 0;
    errors = [];

    document.getElementById("result")
    .style.display="none";

    loadScene();

}

loadScene();

</script>

</body>
</html>
